<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrumfolks Workflow Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-ink: #0a0a0f;
            --gold: #d4a574;
            --teal: #20b2aa;
            --card-bg: #141419;
            --border: #2a2a34;
            --text-primary: #ffffff;
            --text-secondary: #a8a8b8;
            --priority-high: #ff4757;
            --priority-medium: #ffa502;
            --priority-low: #26de81;
            --stage-assigned: #4a69bd;
            --stage-design: #8854d0;
            --stage-content: #20b2aa;
            --stage-editing: #ff6b6b;
            --stage-approval: #ffa502;
            --stage-delivered: #26de81;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, var(--dark-ink) 0%, #1a1a24 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 24px;
            overflow-x: hidden;
        }

        .header {
            margin-bottom: 48px;
            animation: fadeInDown 0.6s ease-out;
        }

        .header h1 {
            font-family: 'Syne', sans-serif;
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--gold) 0%, var(--teal) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 16px;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
            flex-wrap: wrap;
            animation: fadeIn 0.6s ease-out 0.2s backwards;
        }

        .control-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: 8px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            border-color: var(--gold);
            transform: translateY(-2px);
        }

        .control-btn.active {
            background: var(--gold);
            color: var(--dark-ink);
            border-color: var(--gold);
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 12px 20px;
            border-radius: 8px;
            color: var(--text-primary);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--teal);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
            animation: fadeIn 0.6s ease-out 0.3s backwards;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            border-color: var(--gold);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-family: 'Syne', sans-serif;
            font-size: 36px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .team-capacity {
            margin-bottom: 32px;
            animation: fadeIn 0.6s ease-out 0.4s backwards;
        }

        .section-title {
            font-family: 'Syne', sans-serif;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--gold);
        }

        .capacity-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 12px;
        }

        .capacity-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
        }

        .capacity-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .team-name {
            font-weight: 600;
            font-size: 14px;
        }

        .capacity-percent {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .capacity-bar {
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .capacity-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--teal), var(--gold));
            transition: width 0.5s ease;
        }

        .capacity-fill.high {
            background: linear-gradient(90deg, var(--priority-high), #ff6b6b);
        }

        .brands-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
            animation: fadeIn 0.6s ease-out 0.5s backwards;
        }

        .brand-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .brand-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--gold);
            transition: width 0.3s ease;
        }

        .brand-card:hover {
            transform: translateY(-4px);
            border-color: var(--gold);
        }

        .brand-card:hover::before {
            width: 8px;
        }

        .brand-card.priority-high::before {
            background: var(--priority-high);
        }

        .brand-card.priority-medium::before {
            background: var(--priority-medium);
        }

        .brand-card.priority-low::before {
            background: var(--priority-low);
        }

        .brand-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 16px;
        }

        .brand-name {
            font-family: 'Syne', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .priority-badge {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .priority-badge.high {
            background: rgba(255, 71, 87, 0.2);
            color: var(--priority-high);
        }

        .priority-badge.medium {
            background: rgba(255, 165, 2, 0.2);
            color: var(--priority-medium);
        }

        .priority-badge.low {
            background: rgba(38, 222, 129, 0.2);
            color: var(--priority-low);
        }

        .deliverables-summary {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .deliverable-chip {
            font-size: 12px;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            color: var(--text-secondary);
        }

        .stage-tracker {
            display: flex;
            gap: 4px;
            margin-bottom: 12px;
        }

        .stage-dot {
            width: 100%;
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        .stage-dot.active {
            background: var(--teal);
            height: 8px;
        }

        .stage-dot.completed {
            background: var(--stage-delivered);
        }

        .current-stage {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .current-stage strong {
            color: var(--teal);
        }

        .team-assigned {
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .team-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--teal));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 600;
            color: var(--dark-ink);
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .action-btn {
            flex: 1;
            padding: 8px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: var(--teal);
            color: var(--dark-ink);
            border-color: var(--teal);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        .modal-header {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 24px;
            color: var(--gold);
        }

        .modal-close {
            float: right;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: color 0.3s ease;
        }

        .modal-close:hover {
            color: var(--priority-high);
        }

        .stage-selector {
            display: grid;
            gap: 12px;
            margin-bottom: 24px;
        }

        .stage-option {
            padding: 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .stage-option:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--teal);
        }

        .stage-option.selected {
            background: var(--teal);
            color: var(--dark-ink);
            border-color: var(--teal);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 32px;
            }

            .brands-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Workflow Dashboard</h1>
        <p>Real-time view of all active campaigns • Last updated: <span id="lastUpdate">Just now</span></p>
    </div>

    <div class="controls">
        <button class="control-btn active" onclick="filterByStage('all')">All Brands</button>
        <button class="control-btn" onclick="filterByStage('assigned')">Assigned</button>
        <button class="control-btn" onclick="filterByStage('design')">Design Phase</button>
        <button class="control-btn" onclick="filterByStage('content')">Content Phase</button>
        <button class="control-btn" onclick="filterByStage('editing')">Editing</button>
        <button class="control-btn" onclick="filterByStage('approval')">Approval</button>
        <button class="control-btn" onclick="filterByStage('delivered')">Delivered</button>
        <input type="text" class="search-box" placeholder="Search brands..." id="searchBox" oninput="searchBrands()">
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-label">Total Brands</div>
            <div class="stat-value" id="totalBrands">35</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Active Tasks</div>
            <div class="stat-value" id="activeTasks">487</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Awaiting Approval</div>
            <div class="stat-value" id="awaitingApproval">12</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Completed Today</div>
            <div class="stat-value" id="completedToday">23</div>
        </div>
    </div>

    <div class="team-capacity">
        <h2 class="section-title">Team Capacity</h2>
        <div class="capacity-grid" id="capacityGrid"></div>
    </div>

    <h2 class="section-title">Active Campaigns</h2>
    <div class="brands-grid" id="brandsGrid"></div>

    <div class="modal" id="brandModal">

            <h3 class="modal-header" id="modalBrandName"></h3>

            { name: 'GESIA', priority: 10, total: 14, stage: 'delivered', designer: 'Kalgi', content: 'Karan', editor: 'Anthony', poc: 'Bhautik', handler: 'Rushb' },
            { name: 'B Solar', priority: 5, total: 4, stage: 'design', designer: 'Aarti', content: 'Karan', editor: 'Apurva', poc: 'Anushka', handler: 'Rushb' },
            { name: 'Ridham', priority: 5, total: 4, stage: 'content', designer: 'Poornima', content: 'Karan', editor: 'Apurva', poc: 'Anushka', handler: 'Vishve' },
            { name: 'Scrumfolks', priority: 10, total: 26, stage: 'editing', designer: 'Aarti', content: 'Aastha', editor: 'Apurva', poc: 'Anushka', handler: 'Both' },

            { name: 'ABG', priority: 1, total: 2, stage: 'assigned', designer: '-', content: 'Karan', editor: '-', poc: 'Anushka', handler: 'Both' }

        const stageNames = {
            'assigned': 'Assigned',
            'design': 'Design Phase',
            'content': 'Content Phase',
            'editing': 'Editing',
            'approval': 'Client Approval',
            'delivered': 'Delivered'
        };

        let currentFilter = 'all';

        // Initialize capacity grid
        function initCapacityGrid() {
            const grid = document.getElementById('capacityGrid');
            
            Object.entries(teamData).forEach(([team, members]) => {
                members.forEach(member => {
                    const percent = Math.round((member.current / member.capacity) * 100);
                    const capacityClass = percent > 85 ? 'high' : '';
                    
                    const item = document.createElement('div');
                    item.className = 'capacity-item';
                    item.innerHTML = `
                        <div class="capacity-header">
                            <span class="team-name">${member.name}</span>
                            <span class="capacity-percent">${percent}%</span>
                        </div>
                        <div class="capacity-bar">
                            <div class="capacity-fill ${capacityClass}" style="width: ${percent}%"></div>
                        </div>
                    `;
                    grid.appendChild(item);
                });
            });
        }

        // Initialize brands grid
        function initBrandsGrid() {
            renderBrands(brandsData);
        }

        function renderBrands(brands) {
            const grid = document.getElementById('brandsGrid');
            grid.innerHTML = '';

            brands.forEach(brand => {
                const priorityClass = brand.priority >= 8 ? 'high' : brand.priority >= 5 ? 'medium' : 'low';
                const priorityLabel = brand.priority >= 8 ? 'High' : brand.priority >= 5 ? 'Med' : 'Low';
                
                const stages = ['assigned', 'design', 'content', 'editing', 'approval', 'delivered'];
                const currentStageIndex = stages.indexOf(brand.stage);
                
                const card = document.createElement('div');
                card.className = `brand-card priority-${priorityClass}`;
                card.onclick = () => openBrandModal(brand);
                
                card.innerHTML = `
                    <div class="brand-header">
                        <div class="brand-name">${brand.name}</div>
                        <div class="priority-badge ${priorityClass}">${priorityLabel}</div>
                    </div>
                    
                    <div class="deliverables-summary">
                        <div class="deliverable-chip">${brand.total} deliverables</div>
                    </div>
                    
                    <div class="stage-tracker">
                        ${stages.map((stage, i) => 
                            `<div class="stage-dot ${i < currentStageIndex ? 'completed' : i === currentStageIndex ? 'active' : ''}"></div>`
                        ).join('')}
                    </div>
                    
                    <div class="current-stage">
                        Current: <strong>${stageNames[brand.stage]}</strong>
                    </div>
                    
                    <div class="team-assigned">
                        <div class="team-avatar">${brand.designer.charAt(0)}</div>
                        <div class="team-avatar">${brand.content.charAt(0)}</div>
                        <div class="team-avatar">${brand.editor.charAt(0)}</div>
                        <span>${brand.poc}</span>
                    </div>
                    
                    <div class="action-buttons">
                        <button class="action-btn" onclick="event.stopPropagation(); updateStage('${brand.name}')">Update Stage</button>
                        <button class="action-btn" onclick="event.stopPropagation(); flagIssue('${brand.name}')">Flag Issue</button>
                    </div>
                `;
                
                grid.appendChild(card);
            });
        }

        function filterByStage(stage) {
            currentFilter = stage;
            
            // Update button states
            document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            if (stage === 'all') {
                renderBrands(brandsData);
            } else {
                const filtered = brandsData.filter(b => b.stage === stage);
                renderBrands(filtered);
            }
        }

        function searchBrands() {
            const query = document.getElementById('searchBox').value.toLowerCase();
            const filtered = brandsData.filter(b => 
                b.name.toLowerCase().includes(query) ||
                b.designer.toLowerCase().includes(query) ||
                b.content.toLowerCase().includes(query) ||
                b.editor.toLowerCase().includes(query)
            );
            renderBrands(filtered);
        }

        function openBrandModal(brand) {
            const modal = document.getElementById('brandModal');
            const modalBrandName = document.getElementById('modalBrandName');
            const modalContent = document.getElementById('modalContent');
            
            modalBrandName.textContent = brand.name;
            
            modalContent.innerHTML = `
                <div style="margin-bottom: 24px;">
                    <div style="font-size: 14px; color: var(--text-secondary); margin-bottom: 8px;">Priority</div>
                    <div style="font-size: 18px; font-weight: 600;">${brand.priority}/10</div>
                </div>
                
                <div style="margin-bottom: 24px;">
                    <div style="font-size: 14px; color: var(--text-secondary); margin-bottom: 8px;">Total Deliverables</div>
                    <div style="font-size: 18px; font-weight: 600;">${brand.total} items</div>
                </div>
                
                <div style="margin-bottom: 24px;">
                    <div style="font-size: 14px; color: var(--text-secondary); margin-bottom: 8px;">Current Stage</div>
                    <div style="font-size: 18px; font-weight: 600; color: var(--teal);">${stageNames[brand.stage]}</div>
                </div>
                
                <div style="margin-bottom: 24px;">
                    <div style="font-size: 14px; color: var(--text-secondary); margin-bottom: 12px;">Team Assignments</div>
                    <div style="display: grid; gap: 8px;">
                        <div>Designer: <strong>${brand.designer}</strong></div>
                        <div>Content: <strong>${brand.content}</strong></div>
                        <div>Editor: <strong>${brand.editor}</strong></div>
                        <div>POC: <strong>${brand.poc}</strong></div>
                        <div>Handler: <strong>${brand.handler}</strong></div>
                    </div>
                </div>
                
                <div style="margin-bottom: 24px;">
                    <div style="font-size: 14px; color: var(--text-secondary); margin-bottom: 12px;">Update Stage</div>
                    <div class="stage-selector">
                        <div class="stage-option" onclick="selectStage('assigned')">Assigned</div>
                        <div class="stage-option" onclick="selectStage('design')">Design Phase</div>
                        <div class="stage-option" onclick="selectStage('content')">Content Phase</div>
                        <div class="stage-option" onclick="selectStage('editing')">Editing</div>
                        <div class="stage-option" onclick="selectStage('approval')">Client Approval</div>
                        <div class="stage-option" onclick="selectStage('delivered')">Delivered</div>
                    </div>
                </div>
            `;
            
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('brandModal').classList.remove('active');
        }

        function selectStage(stage) {
            alert(`Stage updated to: ${stageNames[stage]}`);
            closeModal();
            // In production, this would update the backend
        }

        function updateStage(brandName) {
            alert(`Update stage for ${brandName}`);
        }

        function flagIssue(brandName) {
            alert(`Flag issue for ${brandName}`);
        }

        // Update timestamp
        setInterval(() => {
            const now = new Date();
            document.getElementById('lastUpdate').textContent = now.toLocaleTimeString();
        }, 60000);

        // Initialize
        initCapacityGrid();
        initBrandsGrid();
    </script>
</body>
</html>
